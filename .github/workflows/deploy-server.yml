name: Deploy Bandrek Server to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-bandrek-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore server/src/Bandrek.Server/Bandrek.Server.csproj

      - name: Publish Release (Linux x64)
        run: |
          dotnet publish server/src/Bandrek.Server/Bandrek.Server.csproj \
            -c Release \
            -r linux-x64 \
            -o ./publish-linux

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync Artifacts via Rsync
        env:
          SSH_TARGET: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./publish-linux/ "$SSH_TARGET:/var/www/bandrek/"

      - name: Restart Service via SSH
        env:
          SSH_TARGET: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_TARGET" '
            set -eu
            sudo systemctl restart bandrek-api
            sleep 2
            if sudo systemctl is-active --quiet bandrek-api; then
              echo ">>> Bandrek Server is RUNNING and ACTIVE! <<<"
            else
              echo ">>> ERROR: Service failed to start! <<<"
              sudo journalctl -u bandrek-api -n 30 --no-pager
              exit 1
            fi
          '
