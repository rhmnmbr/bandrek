name: Deploy Bandrek Server to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore server/src/Bandrek.Server/Bandrek.Server.csproj

      - name: Publish Release (Linux x64)
        run: |
          dotnet publish server/src/Bandrek.Server/Bandrek.Server.csproj \
            -c Release \
            -r linux-x64 \
            -o ./publish-linux

      - name: Transfer Artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "./publish-linux/*"
          target: "~/bandrek-deploy-temp"
          strip_components: 1

      - name: Apply Deploy & Restart Service on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Stopping bandrek-api service..."
            sudo systemctl stop bandrek-api

            echo "Syncing new binary files to /var/www/bandrek/..."
            sudo cp -r ~/bandrek-deploy-temp/* /var/www/bandrek/
            rm -rf ~/bandrek-deploy-temp

            echo "Setting permissions..."
            sudo chown -R www-data:www-data /var/www/bandrek
            sudo chmod -R 755 /var/www/bandrek
            sudo chmod +x /var/www/bandrek/Bandrek.Server

            echo "Starting bandrek-api service..."
            sudo systemctl start bandrek-api

            echo "Verifying service status..."
            sleep 2
            if sudo systemctl is-active --quiet bandrek-api; then
              echo ">>> Bandrek Server successfully deployed and ACTIVE! <<<"
            else
              echo ">>> ERROR: Service failed to start! <<<"
              sudo journalctl -u bandrek-api -n 30 --no-pager
              exit 1
            fi
