services:
  postgres:
    image: postgres:17-alpine
    container_name: bandrek-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: bandrek_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - bandrek_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bandrek_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bandrek_pgdata_dev:
