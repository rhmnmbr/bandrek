# Template konfigurasi Nginx Reverse Proxy untuk Bandrek API
# Simpan di: /etc/nginx/sites-available/bandrek-api
# Lalu buat symlink: sudo ln -s /etc/nginx/sites-available/bandrek-api /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.bimbel-anda.com; # Ganti dengan domain/subdomain Anda

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
